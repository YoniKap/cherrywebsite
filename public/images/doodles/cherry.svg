<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 160 204" fill="none">
  <defs>
    <!-- slight wobble so lines read hand-drawn, like the marker logo -->
    <filter id="w" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="r" cx="32%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff4a3a"/>
      <stop offset=".55" stop-color="#e8141c"/>
      <stop offset="1" stop-color="#9e0b12"/>
    </radialGradient>
    <linearGradient id="l" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fa6d9"/>
      <stop offset=".45" stop-color="#46c23c"/>
      <stop offset="1" stop-color="#d9ec4a"/>
    </linearGradient>
  </defs>
  <g filter="url(#w)" stroke-linecap="round" stroke-linejoin="round">
    <!-- cream sticker edge -->
    <g stroke="#f1e4c9" stroke-width="14" fill="#f1e4c9">
      <path d="M72 100 C 68 66, 78 38, 102 16" fill="none"/>
      <path d="M100 20 C 108 4, 134 0, 142 10 C 138 28, 116 38, 100 20 Z"/>
      <path d="M72 100 C 54 88, 24 98, 24 134 C 24 164, 50 182, 72 176 C 96 182, 122 164, 122 134 C 122 98, 92 88, 72 100 Z"/>
    </g>
    <path d="M72 100 C 68 66, 78 38, 102 16" stroke="#111" stroke-width="10"/>
    <path d="M72 100 C 68 66, 78 38, 102 16" stroke="#5cc93f" stroke-width="4.5"/>
    <path d="M100 20 C 108 4, 134 0, 142 10 C 138 28, 116 38, 100 20 Z" fill="url(#l)" stroke="#111" stroke-width="4.5"/>
    <path d="M102 19 C 114 15, 128 11, 140 10" stroke="#111" stroke-width="2.2"/>
    <path d="M72 100 C 54 88, 24 98, 24 134 C 24 164, 50 182, 72 176 C 96 182, 122 164, 122 134 C 122 98, 92 88, 72 100 Z" fill="url(#r)" stroke="#111" stroke-width="5.5"/>
    <ellipse cx="47" cy="122" rx="7.5" ry="13" transform="rotate(-25 47 122)" fill="#fff"/>
    <circle cx="54" cy="145" r="3.2" fill="#fff"/>
  </g>
</svg>
